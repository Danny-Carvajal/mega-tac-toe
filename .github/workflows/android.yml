name: Android APK

# Compila el APK en la nube de GitHub (gratis en repos públicos) y lo publica en
# la sección Releases (un release nuevo por build, así Obtainium detecta las versiones). Se dispara con cada push a main
# que toque el juego, o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
      - "icon.svg"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar el SDK de Android (ya viene instalado en el runner)
        run: |
          echo "SDK en: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Instalar Godot y las plantillas de exportación
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" tpl
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configurar Godot para exportar a Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Exportar el APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/mega-tac-toe.apk
          ls -la build

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mega-tac-toe-apk
          path: build/mega-tac-toe.apk

      - name: Publicar en Releases (una etiqueta nueva por build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (Android)
          make_latest: true
          body: "APK de debug generado automáticamente desde main. Instalalo en el cel (hay que permitir apps de orígenes desconocidos)."
          files: build/mega-tac-toe.apk

      - name: Borrar releases viejos (deja los últimos 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
